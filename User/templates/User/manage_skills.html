<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Skills</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin-top: 20px;
            background: #70A9A1;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border: 2px solid #79ffed; 
            border-radius: 8px; 
            background-color: #fff; 
        }
        .btn {
            background-color: #79ffed;
            border: none;
            padding: 10px 15px;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #67d2c9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Manage Skills</h2>
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
            {{ form.name }}  <!-- Render the form field -->
        </div>
        
        <div class="form-group">
            <label for="{{ form.percentage.id_for_label }}">{{ form.percentage.label }}</label>
            {{ form.percentage }}  <!-- Render the form field -->
        </div>

        <button type="submit" class="btn">Save Skill</button>
    </form>
</div>

</body>
</html>
