{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
        integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"
        integrity="sha384-vp86vTRFVJgpjF9jiIGPEEqYqlDwgyBgEF109VFjmqGmIY/Y4HV4d3Gp2irVfcrp" crossorigin="anonymous"/>
  <style>
    body {
        margin-top: 20px;
        background: #70A9A1;
    }
    .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
        border: 2px solid #79ffed; 
        border-radius: 8px; 
        background-color: #fff; 
    }
    .blog-post {
        margin-bottom: 30px;
    }
    .blog-post h2 {
        color: #333;
        margin-bottom: 15px;
    }
    .blog-post-meta {
        font-size: 0.9rem;
        color: #666;
    }
    .position-sticky {
        position: -webkit-sticky; /* For Safari */
        position: sticky;
        top: 2rem;
    }
    .bg-body-tertiary {
        background-color: #f8f9fa; /* Light gray background */
        border-radius: 8px;
    }
    .list-unstyled {
        padding-left: 0;
        list-style: none;
    }
    .link-body-emphasis {
        color: #007bff; /* Bootstrap primary color */
        text-decoration: none;
    }
    .link-body-emphasis:hover {
        text-decoration: underline; /* Add underline on hover */
    }
    .img-fluid {
        max-width: 100%;
        height: auto;
    }
    .fst-italic {
        font-style: italic;
    }
    .text-dark {
        color: #000; /* Dark text color */
    }
    .text-body-secondary {
        color: #6c757d; /* Secondary text color */
    }
    .nav-item{
        font-size: 12px;
    }
    i{
        color: white;
    }
  </style>
</head>
<body>
<!-- NAVIGATION BAR -->
<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-light navbarbg sticky-top d-flex mb-5 border-bottom">

      <div class="container-fluid">
          <a class="navbar-brand" href="#">
              <!-- <i class="fab fa-linkedin fa-lg" style="color: #0a66c2; font-size: 2.4rem"></i> -->
               <img src="{% static 'images/logo.png' %}" alt="" srcset="" style="height: 50px;width: 60px;">
               </a>
          <form class="form-inline ">
              <input class="form-control searche" type="search" placeholder="Arama Yap" aria-label="Search"/>
          </form>
          
          <div class="collapse navbar-collapse">
              <ul class="navbar-nav ml-auto">
                  
                  <li class="nav-item active" >
                      <a class="nav-link" href="/">
                          <i class="fas fa-home fa-lg text-center" >
                              <div class="menutext mt-2">
                                  Home
                              </div>
                          </i>
                      </a>
                  </li>
                  
                  <li class="nav-item">
                      <a class="nav-link" href="#">
                          <i class="fas fa-user-friends fa-lg text-center">
                              <div class="menutext mt-2">
                                  My Network
                              </div>
                          </i>
                      </a>
                  </li>
                  
                  <li class="nav-item">
                      <a class="nav-link" href="#">
                          <i class="fas fa-briefcase fa-lg text-center">
                              <div class="menutext mt-2">
                                  Jobs
                              </div>
                          </i>
                      </a>
                  </li>
                  
                  <li class="nav-item">
                      <a class="nav-link" href="#">
                          <i class="fas fa-comment-dots fa-lg text-center">
                              <div class="menutext mt-2">
                                  Messaging
                              </div>
                          </i>
                      </a>
                  </li>
                  
                  <li class="nav-item">
                      <a class="nav-link" href="#">
                          <i class="fas fa-bell fa-lg text-center">
                              <div class="menutext mt-2">
                                  Notifications
                              </div>
                          </i>
                      </a>
                  </li>
                                              
              </ul>
          </div>
      </div>
  </nav>
</div>

<div class="container" style="margin-top: 100px;">
    <div class="row g-5">
        <div class="col-md-8">
            <article class="blog-post">
                <h2 class="display-5 link-body-emphasis mb-1">{{data.title}}</h2>
                <div class="row">
                    <div class="col-sm-4">
                        <p class="blog-post-meta">{{data.Pub_date}}</p>
                    </div>
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4">
                        <p class="blog-post-meta">by <i>{{data.author}}</i></p>
                    </div>
                </div>
                <hr>
                <p>{{data.description|safe}}</p>
            </article>
        </div>

        <div class="col-md-4">
            <div class="position-sticky" style="top: 2rem;">
                <div class="p-4 mb-3 bg-body-tertiary rounded">
                    <img src="{{data.image.url}}" alt="" style="height: 300px; width: 100%; border-radius: 8px;">
                </div>

                <div>
                    <h4 class="fst-italic">Recent posts</h4>
                    <ul class="list-unstyled">
                        {% for i in randomArticles %}
                        <li>
                            <a class="d-flex flex-column flex-lg-row gap-3 align-items-start align-items-lg-center py-3 link-body-emphasis text-decoration-none border-top"
                                href="{% url 'view_article' i.id  %}">
                                <img class="img-fluid" src="{{i.image.url}}" alt=""
                                    style="width: 100px; height: 100px; border-radius: 15px;">
                                <div class="col-lg-8">
                                    <h6 class="mb-0">{{i.title|slice:"0:25"}}...</h6>
                                    <small class="text-body-secondary">{{i.Pub_date}}</small>
                                </div>
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>

                

                
            </div>
        </div>
    </div>
</div>

</body>
</html>
