{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Post</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

  <style>
    body {
        margin-top: 20px;
        background: #70A9A1;
    }
    .container1 {
        max-width: 800px;
        margin: auto;
        padding: 20px;
        border: 2px solid #79ffed; 
        border-radius: 8px; 
        background-color: #fff; 
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    .form-group1 {
        margin-bottom: 15px;
    }
    .form-control1 {
        width: 100%;
        padding: 10px;
        border: 1px solid #53867f;
        border-radius: 5px;
    }
    .btn1 {
        background-color: #79ffed;
        border: none;
        padding: 10px 15px;
        color: #fff;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
    }
    .btn1:hover {
        background-color: #67d2c9;
    }
  </style>

</head>
<body>
  
<!-- NAVIGATION BAR -->
<div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-light navbarbg sticky-top d-flex mb-5 border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                 <img src="{% static 'images/logo.png' %}" alt="" style="height: 50px;width: 60px;">
            </a>
            <form class="form-inline ">
                <input class="form-control searche" type="search" placeholder="Search" aria-label="Search"/>
            </form>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active"><a class="nav-link" href="/"><i class="fas fa-home fa-lg"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-user-friends fa-lg"></i> My Network</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-briefcase fa-lg"></i> Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-comment-dots fa-lg"></i> Messaging</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-bell fa-lg"></i> Notifications</a></li>
                </ul>
            </div>
        </div>
    </nav>
 </div>

<div class="container1 mb-5">
    <h1 class="text-center mb-2">Create a Post</h1>
    <form action="{% url 'create_user_post' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="form-group1 col-md-12">
                <label for="postImage">Image</label>
                <input type="file" name="img" class="form-control1" id="postImage" >
            </div>
            <div class="form-group1 col-md-12">
                <label for="postDesc">Description</label>
                <textarea name="postDesc" class="form-control1" id="postDesc" rows="4" required></textarea>
            </div>
            <div class="form-group col-md-4 col-sm-4 mt-4">
              <label for="exampleInputEmail1">User Name</label>
              <input type="text" class="form-control" id="userName" value="{{ username }}" readonly>
              {{ form.user_profile }}
              <!-- <input type="text" name="name" class="form-control" id="exampleInputEmail1"
                     aria-describedby="emailHelp" placeholder="User Name" value="{{ username }}" readonly> -->
          </div>
            <div class="form-group1 col-md-12 mt-3">
                <input type="submit" class="form-control1 btn1" value="Submit">
            </div>
        </div>
        {{form.media}}
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
